# ============================================================
# 城市政策配置 —— 独立配置文件
# 换城市 = 加一个键，不改一行代码
# ============================================================
#
# 字段说明：
#   筹码类型   场景型 / 资本型 / 平台型 / 人才型  —— 决定邀约理由的写法
#   来源等级   A=官方文件  B=权威媒体/解读  C=商业数据库  D=推断
#   待核项     已知不确定的地方，必须显式写出，不允许隐瞒
# ============================================================

亦庄:
  名称: 北京亦庄（北京经济技术开发区）
  筹码类型: 场景型
  招商路径: 主动型 —— 用场景需求吸引企业落地
  一句话定位: 全国机器人产业第一梯队，卖点是「企业来了有活干」

  产业基础:
    企业数量: 300+ 家机器人相关企业
    产业链规模: 超百亿元
    产业体系: 「核心零部件 + 人形/工业/特种/医疗/协作/物流机器人」的「1+6」体系
    来源: 人民日报海外版 / 央视网，2026-02-24
    等级: A

  政策文件:
    - 名称: 《北京经济技术开发区建设全球一流具身智能机器人产业新城行动计划（2024—2026年）》
      发布: 2024
      来源: 北京市政府网
      等级: A
    - 名称: 具身智能机器人十条
      发布: 2025-08
      要点: 每年 1 亿元「数据券」、打样券、人形机器人销售补贴
      来源: 数字中国，2025-08-15
      等级: A

  政策工具:
    - 每年 1 亿元数据券
    - 打样券（降低试制成本）
    - 人形机器人销售补贴
    - 百亿机器人产业基金

  稀缺筹码:
    - 40+ 真实开放场景（超市、药房、酒店、仓库等）
    - 九大标杆场景机会清单：两年释放超万台、近 50 亿元应用机会，其中超千台为人形机器人需求
    - 世界机器人大会永久会址
    - 25 万平方米北京市机器人产业园
    - 北京市首个人形机器人中试验证平台
    - 北京市首个机器人柔性敏捷制造平台
    - 具身智能机器人 4S 店

  2027目标:
    目标:
      - 打造不少于 10 个标杆智能场景综合体
      - 推动 100 个垂类模型落地应用
      - 聚集人工智能产业链核心企业 1000 家
    来源: 北京经开区工委书记公开表述，2026-02
    等级: A

  本地代表企业:
    - 北京人形机器人创新中心（「天工」）
    - 京东科技
    - 和利时
    - 九识智能
    - 京仪装备
    - 锐洁机器人
    - 智同科技
    - 因时机器人
    - 北京精雕

  邀约理由模板: "贵司所处的{环节}是亦庄具身智能产业链的关键缺口。亦庄已开放{场景数}个真实场景，并发布九大标杆场景机会清单，两年释放超万台、近 50 亿元应用机会。诚邀落地，与需求方直接对接。"

  来源汇总:
    - 人民日报海外版 / 央视网，2026-02-24
    - 北京市政府网，2025-08-20
    - 数字中国，2025-08-15
  待核项:
    - 场景清单的年度更新情况
    - 各项补贴的申报条件与兑现周期


深圳:
  名称: 深圳
  筹码类型: 资本型
  招商路径: 顺水推舟型 —— 用已投企业网络触达
  一句话定位: 整机龙头集聚 + 国资资本活跃，卖点是「企业来了有钱有客户」

  产业基础:
    特征: 整机龙头集聚，2026 年进入万台级产能释放期
    代表企业: 优必选
    来源: 行业报道，2026-05
    等级: B

  政策文件:
    - 名称: 《深圳市具身智能机器人技术创新与产业发展行动计划（2025—2027年）》
      发布: 修订版 2026-06-18 印发
      来源: 深圳市科技创新局
      等级: A

  政策工具:
    - 专项补贴
    - 产业基金
    - 补贴金额: 公开解读口径约 5000 万元
      来源: 媒体政策解读，2026-07
      等级: B
      备注: 非原文表述，引用前须回溯政策原文

  稀缺筹码:
    - 深创投等国资体系（资本网络）
    - 整机龙头就近配套（优必选等）
    - 电子信息产业链完整，硬件供应链半径短

  本地代表企业:
    - 优必选（人形机器人整机）
    - 雷赛智能（运动控制）

  邀约理由模板: "深圳具备完整的硬件供应链与活跃的国资资本体系。贵司所处的{环节}可与本地整机龙头形成就近配套，并可通过产业基金获得资本支持。诚邀落地，接入本地供应链。"

  来源汇总:
    - 深圳市科技创新局，2026-06-18
    - 媒体政策解读，2026-07
  待核项:
    - 5000 万元补贴为媒体解读口径，需回溯政策原文
    - 千亿级产业目标的具体口径与时间表


苏州:
  名称: 苏州
  筹码类型: 平台型
  招商路径: 主动型 —— 用创新平台与补贴吸引
  一句话定位: 政策工具最具体、补贴最直接，卖点是「企业来了有真金白银」

  产业基础:
    特征: 制造业基础雄厚，谐波减速器等核心零部件有龙头
    来源: 公开资料
    等级: B

  政策文件:
    - 名称: 《苏州市支持具身智能机器人产业创新发展的若干措施》
      发布: 2025-04 印发，2025-06-01 施行，有效期至 2027-12-31
      来源: 苏州市人民政府
      等级: A

  政策工具:
    清单:
      - 高能级创新平台：分类分阶段给予最高 2 亿元支持
      - 江苏省重点实验室 / 工程技术联合实验室：最高 2000 万元
      - 江苏省技术创新中心：最高 1000 万元
      - 江苏省工程研究中心 / 制造业创新中心：最高 500 万元
      - 苏州市重点实验室：最高 100 万元
      - 创新联合体运营经费：最高 200 万元
      - 公共服务平台：最高 200 万元
      - 具身智能大模型（参数量超百亿 + 场景不少于 5 个）：按算力使用成本 50%，每年最高 300 万元，最多 3 年
      - 人工智能算力使用费：按实际支付 20% 补贴，每年最高 200 万元
      - 首台（套）装备：每台（套）最高 100 万元；人形机器人上浮 20%
      - 人才公共实训基地：最高 100 万元
      - 专业展览：最高 200 万元
    来源: 苏州市人民政府政策原文
    等级: A

  重点支持环节:
    - 机器人专用芯片
    - 驱控一体化关节
    - 高精度减速器
    - 高性能控制器
    - 新型传感器
    - 人形机器人「大脑、小脑、肢体」

  稀缺筹码:
    - 创新平台最高 2 亿元支持（力度在同级城市中突出）
    - 「机器人+」9 大领域开放场景：智能制造、智能建造、智慧医疗、智慧物流、智慧养老、智慧商业、智慧农业、智慧应急、智慧文旅
    - 每年发布《苏州市「机器人+」典型场景应用目录》

  本地代表企业:
    - 绿的谐波（谐波减速器，待核）

  邀约理由模板: "苏州对具身智能机器人产业链关键环节有明确的资金支持：创新平台最高 2 亿元、首台（套）装备最高 100 万元（人形机器人上浮 20%）、大模型算力成本补贴 50%（每年最高 300 万元、最多 3 年）。贵司所处的{环节}正属于重点支持方向。诚邀落地对接。"

  来源汇总:
    - 苏州市人民政府《苏州市支持具身智能机器人产业创新发展的若干措施》，2025-04
  待核项:
    - 各项支持的申报门槛与兑现周期
    - 苏州工业园区专项产业行动计划的配套细则


陕西:
  名称: 陕西（西安）
  筹码类型: 人才型
  招商路径: 主动型 —— 用科研人才与要素成本吸引研发分部
  一句话定位: 高校科研资源强、要素成本低，卖点是「企业来了有人、更便宜」

  产业基础:
    企业数量: 机器人相关注册企业超 200 家
    核心企业: 整机研发、核心零部件制造及二次开发企业 85 家
    统计时点: 2026-04
    来源: 陕西省人民政府，2026-06-18
    等级: A

  政策文件:
    - 名称: 《抢抓具身智能产业机遇培育产业新优势三年行动计划（2026—2028年）》
      发布: 2026-04-28
      主体: 西安高新区
      来源: 陕西省科学技术厅，2026-05-11
      等级: A

  政策工具:
    - 三年行动计划配套支持
    - 锚定百亿「新赛道」目标

  稀缺筹码:
    - 西安交通大学、西北工业大学等高校科研资源
    - 要素成本（土地、人力）低于一线城市
    - 处于产业起步期，政策弹性与合作空间较大

  本地代表企业:
    - 待补充（需接入企查查或本地团队补充）

  邀约理由模板: "陕西拥有西安交通大学、西北工业大学等高校科研资源，要素成本显著低于一线城市。贵司所处的{环节}如设立研发分部或中试基地，可对接本地科研力量并降低运营成本。诚邀落地对接。"

  来源汇总:
    - 陕西省人民政府，2026-06-18
    - 陕西省科学技术厅，2026-05-11
  待核项:
    - 三年行动计划的具体支持条款与金额
    - 本地承接能力（厂房、供应链配套）
    - 本地代表企业清单
