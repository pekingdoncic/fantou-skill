# ============================================================
# 产业知识库配置 —— 独立配置文件
# 含证据等级定义 + 产业链框架
# ============================================================

# ------------------------------------------------------------
# 证据分级 —— 贯穿全流程的最重要规则
# ------------------------------------------------------------
证据等级:
  A:
    名称: 官方文件
    定义: 官方公示 / 政府文件 / 企业公告 / 年报
    可否对外: true
    处理: 可直接引用
  B:
    名称: 权威媒体
    定义: 权威媒体 / 行业协会 / 机构研报
    可否对外: true
    处理: 需标注来源
  C:
    名称: 商业数据库
    定义: 企查查 / 天眼查等结构化字段
    可否对外: true
    处理: 需人工抽检
  D:
    名称: 模型推断
    定义: 模型推断 / 行业惯例推测
    可否对外: false
    处理: 必须标「推断」，禁止对外

置信度规则:
  高: 有 A 级证据支撑
  中: 有 B 或 C 级证据支撑
  低: 仅有 D 级推断或证据缺失
  低置信度处理: 自动标注「禁止对外」，且不得进入优先级排序

# ------------------------------------------------------------
# 产业链框架
# ------------------------------------------------------------
具身智能机器人:
  别名: [人形机器人, 机器人, 具身智能]

  # 在线检索词 —— 必须用「具体环节词」。
  # 实测：泛词（如"机器人"）在巨潮接口会匹配到「信息技术」等噪音，且 pageSize 上限 30，
  #       结果被噪音占满；具体词（"减速器"）命中精准。
  在线检索词:
    - 减速器
    - 谐波减速器
    - 无框力矩电机
    - 力矩电机
    - 六维力传感器
    - 力传感器
    - 灵巧手
    - 伺服电机
    - 机器人关节
    - 行星滚柱丝杠

  # 在线行业词 —— 用于过滤跨行业噪音。
  # 东方财富是全文模糊检索：搜「减速器 扩产」会返回「胶原蛋白扩产竞速」「光模块扩产」，
  # 必须要求标题里出现本表任一词，否则丢弃。
  在线行业词:
    - 机器人
    - 具身智能
    - 人形
    - 减速器
    - 减速机
    - 电机
    - 传感器
    - 灵巧手
    - 丝杠
    - 关节
    - 伺服
    - 谐波
    - 力矩
    - 力觉
    - 触觉
    - 执行器
    - 机械臂
    - 本体
    - 零部件

  上游核心零部件:
    - 减速器（谐波/RV）
    - 伺服与无框力矩电机
    - 控制器
    - 六维力/力矩传感器
    - 灵巧手
    - 具身智能芯片
  中游本体与集成:
    - 人形机器人本体
    - 工业/物流/特种/医疗/协作机器人
    - 运动控制与系统集成
  下游应用场景:
    - 商超零售
    - 医药流通
    - 酒店服务
    - 仓储物流
    - 工业制造
    - 医疗康复
  补链优先级:
    六维力/力矩传感器:
      优先级: P0
      理由: 人形机器人力控刚需，单台用量 4 个以上，价值量高，国内供给集中度低
    无框力矩电机:
      优先级: P0
      理由: 单台人形机器人需 20+ 台，关节核心部件，与灵巧手/关节模组强协同
    谐波减速器:
      优先级: P1
      理由: 国产化窗口期，但长三角已有强势龙头，需差异化招商
    具身智能芯片:
      优先级: P1
      理由: 政策明确方向，但长周期重资本，宜以基金+平台方式引入
    灵巧手:
      优先级: P1
      理由: 与传感器/微型丝杠强协同
    仿真与数据平台:
      优先级: P2
      理由: 非制造环节，可通过合作而非落地方式解决

  # 环节关键词 —— 用于从新闻标题推断企业所属环节。
  # 在线抓来的新闻标题不含结构化环节字段，必须靠关键词推断；
  # 推断不出就留空（标「待归类」），不硬塞。
  # 匹配规则：**长词优先**（「无框力矩电机」优先于「电机」）
  #
  # ⚠️ 这里**刻意不放泛词「电机」「传感器」之外的宽词**：
  #   实测「电机」会把「三星电机（ABF 基板）」「银轮股份（发电机尾气）」
  #   「德昌电机（微电机）」全部误归到「无框力矩电机」，并错误打上 P0。
  #   宁可归到「待归类」让人工判断，也不要给出错误的环节判断。
  环节关键词:
    六维力/力矩传感器: [六维力, 力矩传感器, 力传感器, 力觉, 触觉, 传感器]
    无框力矩电机: [无框力矩电机, 力矩电机, 关节模组, 无框电机]
    谐波减速器: [谐波减速器, 谐波, RV减速器, 减速器, 减速机]
    灵巧手: [灵巧手, 灵巧机械手]
    行星滚柱丝杠: [行星滚柱丝杠, 滚柱丝杠, 丝杠]
    具身智能芯片: [具身智能芯片, 机器人芯片, 智算芯片]

# ------------------------------------------------------------
# 沙龙方案默认参数
# ------------------------------------------------------------
沙龙默认:
  规模上限: 20
  人群配比:
    目标企业: "6-8 家"
    本体厂商: "3-4 家"
    政府: "2-3 人"
    基金: "3-4 人"
  必须包含环节: 需求侧（本地厂商真实需求）
  评价指标:
    - 会后 2 周内进入实质沟通的有效线索数
    - 现场达成的联合开发/试用意向数
    - 3 个月内落地或设立主体的企业数
  禁止考核:
    - 参会人数
    - 媒体曝光量
    - 名片交换数
