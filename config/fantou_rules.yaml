# ============================================================
# 返投认定口径配置 —— 独立配置文件
# ============================================================
#
# ⚠️ 重要：口径来自每只基金各自的 LPA / 补充协议 / 引导基金管理办法，
#    必须由法务逐只基金确认。本文件只是「承载」，不生成口径。
#
# ⚠️ 硬约束：当 `确认状态: 未确认` 时，工具不会输出线索优先级排序，
#    只输出平铺清单并附提示。
#    理由：口径没确认之前，「哪条线索值得追」这个问题无法回答。
# ============================================================

基金A:
  基金名称: 示例基金A（政府引导基金）
  返投倍数: 1.5
  认定范围:
    - 新设主体
    - 迁入主体
    - 新增产能投资
    - 本地子公司
  是否含研发中心: false
  是否含供应链采购额: false
  认定周期: 待确认
  来源: 待法务确认（LPA / 引导基金管理办法）
  确认人: 待指定
  确认状态: 未确认
  备注: 研发中心是否计入直接决定线索优先级，必须优先确认


基金B:
  基金名称: 示例基金B（社保类）
  返投倍数: 不适用（社保类无返投要求）
  认定范围: []
  是否含研发中心: 不适用
  是否含供应链采购额: 不适用
  认定周期: 不适用
  来源: 待法务确认
  确认人: 待指定
  确认状态: 未确认
  备注: 社保类 LP 关注点为报送与信息披露，非返投


基金C:
  基金名称: 示例基金C（市场化母基金）
  返投倍数: 1.0
  认定范围:
    - 新设主体
    - 迁入主体
    - 新增产能投资
    - 本地子公司
    - 研发中心
    - 供应链采购额
  是否含研发中心: true
  是否含供应链采购额: true
  认定周期: 待确认
  来源: 待法务确认
  确认人: 待指定
  确认状态: 未确认
  备注: 口径较宽，可作为「宽松口径」对照案例
